  <line x1="18.7" y1="8" x2="18.7" y2="40" stroke="white" stroke-width="1" opacity=".4"/>
  <line x1="29.3" y1="8" x2="29.3" y2="40" stroke="white" stroke-width="1" opacity=".4"/>
