<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="white">
  <!-- KenKen: grid with cage borders (thick L-shapes) -->
  <!-- Full grid background -->
  <rect x="4" y="4" width="40" height="40" rx="3" opacity=".15"/>
  <!-- Cage outlines (thick border segments) -->
  <!-- Top-left 2x1 cage -->
  <rect x="4" y="4" width="20" height="13" rx="2.5" fill="none" stroke="white" stroke-width="2.5"/>
  <!-- Top-right cell -->
  <rect x="26" y="4" width="18" height="13" rx="2.5" fill="none" stroke="white" stroke-width="2.5"/>
  <!-- Middle-left cell -->
  <rect x="4" y="19" width="13" height="13" rx="2.5" fill="none" stroke="white" stroke-width="2.5"/>
  <!-- Middle 2x1 cage -->
  <rect x="19" y="19" width="25" height="13" rx="2.5" fill="none" stroke="white" stroke-width="2.5"/>
  <!-- Bottom-left 2x1 cage -->
  <rect x="4" y="34" width="25" height="10" rx="2.5" fill="none" stroke="white" stroke-width="2.5"/>
  <!-- Bottom-right cell -->
  <rect x="31" y="34" width="13" height="10" rx="2.5" fill="none" stroke="white" stroke-width="2.5"/>
  <!-- Small target numbers in corners -->
  <circle cx="9" cy="9" r="3" opacity=".7"/>
  <circle cx="31" cy="9" r="3" opacity=".7"/>
  <circle cx="9" cy="24" r="3" opacity=".7"/>
</svg>
