<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white">
  <!-- Chain links representing word chain -->
  <!-- Link 1 (left) -->
  <rect x="1" y="8" width="8" height="8" rx="3" fill="none" stroke="white" stroke-width="2"/>
  <!-- Link 2 (center, overlapping) -->
  <rect x="8" y="8" width="8" height="8" rx="3" fill="none" stroke="white" stroke-width="2" opacity=".8"/>
  <!-- Link 3 (right, overlapping) -->
  <rect x="15" y="8" width="8" height="8" rx="3" fill="none" stroke="white" stroke-width="2" opacity=".6"/>
  <!-- Arrow at bottom suggesting flow -->
  <line x1="4" y1="20" x2="20" y2="20" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity=".5"/>
  <line x1="17" y1="18" x2="20" y2="20" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity=".5"/>
  <line x1="17" y1="22" x2="20" y2="20" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity=".5"/>
</svg>
