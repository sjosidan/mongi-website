<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white">
  <!-- 4x3 grid of character tiles -->
  <rect x="1" y="3" width="4.5" height="4.5" rx="1" fill="none" stroke="white" stroke-width="1.2"/>
  <rect x="7" y="3" width="4.5" height="4.5" rx="1" fill="none" stroke="white" stroke-width="1.2"/>
  <rect x="13" y="3" width="4.5" height="4.5" rx="1" fill="none" stroke="white" stroke-width="1.2"/>
  <rect x="19" y="3" width="4.5" height="4.5" rx="1" fill="none" stroke="white" stroke-width="1.2"/>
  <rect x="1" y="9.5" width="4.5" height="4.5" rx="1" fill="none" stroke="white" stroke-width="1.2"/>
  <rect x="7" y="9.5" width="4.5" height="4.5" rx="1" fill="white" opacity=".3"/>
  <rect x="7" y="9.5" width="4.5" height="4.5" rx="1" fill="none" stroke="white" stroke-width="1.2"/>
  <rect x="13" y="9.5" width="4.5" height="4.5" rx="1" fill="white" opacity=".3"/>
  <rect x="13" y="9.5" width="4.5" height="4.5" rx="1" fill="none" stroke="white" stroke-width="1.2"/>
  <rect x="19" y="9.5" width="4.5" height="4.5" rx="1" fill="none" stroke="white" stroke-width="1.2"/>
  <rect x="1" y="16" width="4.5" height="4.5" rx="1" fill="none" stroke="white" stroke-width="1.2"/>
  <rect x="7" y="16" width="4.5" height="4.5" rx="1" fill="none" stroke="white" stroke-width="1.2"/>
  <rect x="13" y="16" width="4.5" height="4.5" rx="1" fill="white" opacity=".3"/>
  <rect x="13" y="16" width="4.5" height="4.5" rx="1" fill="none" stroke="white" stroke-width="1.2"/>
  <rect x="19" y="16" width="4.5" height="4.5" rx="1" fill="none" stroke="white" stroke-width="1.2"/>
  <!-- Connecting lines between selected tiles -->
  <line x1="9.25" y1="14" x2="9.25" y2="16" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity=".7"/>
  <line x1="11.5" y1="11.75" x2="13" y2="11.75" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity=".7"/>
</svg>
