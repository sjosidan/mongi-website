<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="white">
  <!-- Nonogram-style grid -->
  <rect x="14" y="14" width="26" height="26" rx="1" fill="none" stroke="white" stroke-width="1.5"/>
  <!-- Grid lines -->
  <line x1="20.5" y1="14" x2="20.5" y2="40" stroke="white" stroke-width=".5" opacity=".3"/>
  <line x1="27" y1="14" x2="27" y2="40" stroke="white" stroke-width=".5" opacity=".3"/>
  <line x1="33.5" y1="14" x2="33.5" y2="40" stroke="white" stroke-width=".5" opacity=".3"/>
  <line x1="14" y1="20.5" x2="40" y2="20.5" stroke="white" stroke-width=".5" opacity=".3"/>
  <line x1="14" y1="27" x2="40" y2="27" stroke="white" stroke-width=".5" opacity=".3"/>
  <line x1="14" y1="33.5" x2="40" y2="33.5" stroke="white" stroke-width=".5" opacity=".3"/>
  <!-- Filled cells (pixel art pattern) -->
  <rect x="14" y="14" width="6.5" height="6.5" fill="white" opacity=".8"/>
  <rect x="27" y="14" width="6.5" height="6.5" fill="white" opacity=".5"/>
  <rect x="20.5" y="20.5" width="6.5" height="6.5" fill="white" opacity=".6"/>
  <rect x="33.5" y="20.5" width="6.5" height="6.5" fill="white" opacity=".8"/>
  <rect x="14" y="33.5" width="6.5" height="6.5" fill="white" opacity=".5"/>
  <rect x="27" y="33.5" width="6.5" height="6.5" fill="white" opacity=".7"/>
  <!-- Row/col clue hints -->
  <rect x="8" y="16" width="4" height="3" rx="1" fill="white" opacity=".4"/>
  <rect x="8" y="22" width="4" height="3" rx="1" fill="white" opacity=".4"/>
  <rect x="16" y="8" width="3" height="4" rx="1" fill="white" opacity=".4"/>
  <rect x="28" y="8" width="3" height="4" rx="1" fill="white" opacity=".4"/>
</svg>
