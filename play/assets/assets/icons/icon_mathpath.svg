<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="white">
  <!-- MathPath: winding path through grid cells -->
  <!-- Path line -->
  <polyline points="8,8 8,20 20,20 20,32 32,32 32,20 44,20" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".4"/>
  <!-- Path nodes (numbers along the path) -->
  <circle cx="8" cy="8" r="5"/>
  <circle cx="8" cy="20" r="5" opacity=".7"/>
  <circle cx="20" cy="20" r="5"/>
  <circle cx="20" cy="32" r="5" opacity=".7"/>
  <circle cx="32" cy="32" r="5"/>
  <circle cx="32" cy="20" r="5" opacity=".7"/>
  <circle cx="44" cy="20" r="5"/>
</svg>
